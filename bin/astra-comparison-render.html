<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>Rendering the Astra comparison</title>
<script type="importmap">{"imports":{"three":"/after/vendor/three/build/three.module.js"}}</script>
</head><body><script type="module">
import * as THREE from 'three';

// Both snapshots get the same clock and random stream, including canvas screens.
const NativeDate = Date;
const engineRandom = Math.random;
globalThis.Date = class extends NativeDate {
  constructor(...args) { super(...(args.length ? args : ['2026-09-07T13:00:00'])); }
  static now() { return new NativeDate('2026-09-07T13:00:00').getTime(); }
};
function seedRandom() {
  let s = 1;
  Math.random = () => {
    // Three also uses Math.random for invisible UUIDs. New materials allocate
    // extra IDs, which must not shuffle books or the code drawn on a screen.
    if (new Error().stack.includes('at generateUUID')) return engineRandom();
    s += 0x6D2B79F5;
    let t = Math.imul(s ^ (s >>> 15), 1 | s);
    t ^= t + Math.imul(t ^ (t >>> 7), 61 | t);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const snapshots = {};
for (const side of ['before', 'after']) {
  const paths = ['scene/build', 'config', 'projects', 'scene/lighting',
    'scene/environment', 'scene/props', 'scene/night-lights'];
  snapshots[side] = Object.assign({}, ...await Promise.all(paths.map(p => import(`/${side}/src/${p}.js`))));
}
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.VSMShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.body.append(renderer.domElement);
const reflections = snapshots.after.createReflectionEnvironment(renderer);

function prepare(source) {
  source.clearMaterialCache();
  source.releaseNightLightAssets();
  const theme = source.resolveTheme(source.PROJECTS[0], { season: 'summer' });
  source.applyPalette(theme.palette);
  seedRandom();
  return theme;
}

function photograph({ scene, camera }, source, wide = false) {
  renderer.setSize(wide ? 1440 : 960, wide ? 900 : 800);
  renderer.render(scene, camera);
  const data = renderer.domElement.toDataURL('image/webp', 0.9);
  source.disposeSubtree(scene);
  scene.traverse(o => o.shadow?.dispose());
  return data;
}

async function scenePair(building, options = {}) {
  const pair = {};
  const metrics = {};
  for (const side of ['before', 'after']) {
    const source = snapshots[side];
    prepare(source);
    const theme = source.resolveTheme(source.PROJECTS[0], { season: options.season || 'summer', building });
    source.applyPalette(theme.palette);
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(theme.sky);
    if (source.createReflectionEnvironment) scene.environment = reflections.texture;
    const started = performance.now();
    const lights = source.addLighting(scene, theme.light);
    const env = source.buildEnvironment(scene, theme);
    source.buildProps(scene, theme);
    const sun = source.applyTimeOfDay(lights, options.hour ?? 13, theme, scene);
    source.applyNightLights(env.nightLights, sun.lampOn);
    const c = source.CAMERA;
    const camera = new THREE.OrthographicCamera(-c.frustum * 1.6, c.frustum * 1.6, c.frustum, -c.frustum, 0.1, 1000);
    camera.position.set(...c.position);
    camera.lookAt(...c.target);
    camera.zoom = options.zoom ?? 1;
    if (options.plan) {
      camera.position.set(-13, 150, -12); camera.up.set(0, 0, -1); camera.lookAt(-13, 0, -12);
    } else if (options.zoom && options.zoom < 1) {
      const offset = new THREE.Vector3(-13, 0, -12);
      const target = new THREE.Vector3(...c.target).add(offset);
      camera.position.add(offset).sub(target).multiplyScalar(1 / options.zoom).add(target);
      camera.lookAt(target);
    }
    if (options.rotate) {
      const target = new THREE.Vector3(...c.target);
      camera.position.sub(target).applyAxisAngle(new THREE.Vector3(0, 1, 0), options.rotate).add(target);
      camera.lookAt(target);
    }
    camera.updateProjectionMatrix();
    metrics[side] = { buildMs: Math.round(performance.now() - started) };
    renderer.setSize(1440, 900);
    renderer.render(scene, camera); // shader warmup excluded from steady frame samples
    const samples = [];
    for (let i = 0; i < 9; i++) {
      const start = performance.now(); renderer.render(scene, camera); renderer.getContext().finish();
      samples.push(performance.now() - start);
    }
    samples.sort((a,b) => a-b);
    Object.assign(metrics[side], { frameMs: Math.round(samples[4] * 10) / 10,
      calls: renderer.info.render.calls, triangles: renderer.info.render.triangles,
      textures: renderer.info.memory.textures });
    pair[side] = photograph({ scene, camera }, source, true);
  }
  return { ...pair, metrics };
}
window.comparison = {
  objects: [], groups: [], scenePair,
};
document.title = 'Comparison renderer ready';
</script></body></html>
