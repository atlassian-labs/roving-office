<!DOCTYPE html>
<!--
  The studio: one object from src/scene/catalogue.js, lit and framed on its own.

  Driven by bin/prop-portrait.js, which serves this page and points a headless
  Chrome at it once per object, but it is a perfectly good page to open by hand —
  http://localhost:8081/bin/prop-portrait.html?id=chair — when you are working on
  a prop and want to see it without the room in the way.

  Query string:
    id=<catalogue id>   which object (default: chair)
    size=<px>           square canvas, in pixels (default: 900)
    seed=<n>            override the random seed; see below
    face=<radians>      override the catalogue's own rotation, to look round the back

  Two things here matter more than they look.

  The background is transparent, so a portrait drops onto a light or a dark page
  equally well — which a docs site needs, since it may be either.

  And Math.random is replaced with a seeded generator before anything is built.
  Half the scene is deliberately random — book colours, kanban cards, which way a
  cactus leans — so without this every regeneration of the gallery would rewrite
  every file, and a real change would be invisible in the diff. Seeded from the id,
  so each object keeps its own look while staying the same between runs.
-->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>prop portrait</title>
  <script type="importmap">
    {
      "imports": {
        "three": "/vendor/three/build/three.module.js",
        "three/addons/": "/vendor/three/examples/jsm/"
      }
    }
  </script>
  <style>
    html, body { margin: 0; height: 100%; background: transparent; }
    canvas { display: block; }
    #error {
      position: absolute; inset: 0; display: none; padding: 2rem;
      font: 16px/1.5 ui-monospace, monospace; color: #b3261e; background: #fff;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
<pre id="error"></pre>
<!--
  Two module scripts, in this order, and the order is the point: module scripts run
  in document order, so the seed is installed before anything that builds geometry
  is even imported. Static imports, too, rather than a dynamic import() inside a
  try — the shutter fires at load, and load does not wait for a promise, so a
  dynamically imported scene is a photograph of an empty page. This is the same
  lesson reception's late-loading vignette teaches, from the other side.
-->
<script type="module">
const params = new URLSearchParams(location.search);
const id = params.get('id') || 'chair';

// A screenshot of a stack trace is worth having: Chrome fires the shutter whatever
// happened, so a failure has to be something you can see in the PNG.
window.portraitFail = (err) => {
  const el = document.getElementById('error');
  el.style.display = 'block';
  el.textContent = `prop-portrait: ${id}\n\n${err?.stack || err}`;
  console.error(err);
};
window.addEventListener('error', (e) => window.portraitFail(e.error || e.message));

// --- Seeded randomness, installed before any scene module is imported ---------
function hash(str) {
  let h = 2166136261;
  for (let i = 0; i < str.length; i++) {
    h ^= str.charCodeAt(i);
    h = Math.imul(h, 16777619);
  }
  return h >>> 0;
}

let seedState = (Number(params.get('seed')) || hash(id)) >>> 0;
Math.random = function seeded() {
  seedState = (seedState + 0x6d2b79f5) >>> 0;
  let t = seedState;
  t = Math.imul(t ^ (t >>> 15), t | 1);
  t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
};
</script>
<script type="module">
import * as THREE from 'three';
import { buildCatalogueObject, CATALOGUE_BY_ID, viewFor } from '/src/scene/catalogue.js';
import { createRenderer } from '/src/scene/renderer.js';

/**
 * The box to frame, which is not quite the box the object occupies.
 *
 * Additively blended meshes are excluded: in this scene those are the glow pools
 * that after-dark lighting lays on the ground, and they are light rather than
 * object. The street lamp's pool is ten metres across, so a box that contained it
 * put the lamp in the middle of an empty square — a picture of a bounding box.
 *
 * Ordinary transparency stays in. The water cooler's bottle is see-through and is
 * very much part of the water cooler.
 *
 * @param {THREE.Object3D} root
 * @returns {THREE.Box3}
 */
function framingBox(root) {
  const box = new THREE.Box3();
  root.traverse((node) => {
    if (!node.isMesh) return;
    const materials = Array.isArray(node.material) ? node.material : [node.material];
    if (materials.some((m) => m?.blending === THREE.AdditiveBlending)) return;
    box.expandByObject(node);
  });
  // A subject made of nothing but light is still a subject.
  return box.isEmpty() ? new THREE.Box3().setFromObject(root) : box;
}

const params = new URLSearchParams(location.search);
const id = params.get('id') || 'chair';
const size = Number(params.get('size') || 900);

try {
  const entry = CATALOGUE_BY_ID.get(id);
  if (!entry) throw new Error(`No object called "${id}".`);
  const view = viewFor(entry);
  if (params.has('face')) view.face = Number(params.get('face'));

  const subject = buildCatalogueObject(id);
  // Whatever the builder did with position — several place themselves where they
  // stand in the room — a portrait is taken at the origin.
  subject.position.set(0, 0, 0);
  subject.rotation.y = view.face;
  subject.updateMatrixWorld(true);

  const canvas = document.createElement('canvas');
  document.body.appendChild(canvas);
  // The office's own look, so brushed steel and a glowing monitor read here exactly
  // as they do in the room. The picture is the backing store, so `false` leaves the
  // canvas's CSS size to the page.
  const renderer = createRenderer({ canvas, transparent: true, pixelRatio: 1 });
  renderer.setSize(size, size, false);

  const scene = new THREE.Scene();
  scene.add(subject);

  // A studio rather than the room: the office's light rig is a low sun raking
  // through one wall, which is the wrong thing entirely for a single object. This
  // is a soft fill, a warm key that casts the shadow, and a cool rim to keep an
  // edge on the dark props — the chair is nearly black, and against nothing at all
  // it would read as a silhouette.
  scene.add(new THREE.HemisphereLight(0xdfe8f5, 0x4a4038, 1.15));
  const key = new THREE.DirectionalLight(0xfff4e2, 2.1);
  key.castShadow = true;
  key.shadow.mapSize.set(2048, 2048);
  scene.add(key);
  const rim = new THREE.DirectionalLight(0xbcd4ff, 0.6);
  rim.position.set(-7, 4, -5);
  scene.add(rim);

  // Framed from the subject's own bounding box, which is what lets one page
  // photograph a succulent and a couch without being told the difference.
  //
  // Fitted corner by corner rather than by the bounding sphere. A sphere is easy
  // and always too loose: a rug and a desk are both much wider than they are tall,
  // so a sphere that contains them is mostly air, and the portrait comes back as a
  // small object in a large empty square. This walks the eight corners in camera
  // space and asks each one how far back the camera would have to be for it to sit
  // inside the frame; the answer is the largest of those.
  const bbox = framingBox(subject);
  const centre = bbox.getCenter(new THREE.Vector3());
  const radius = bbox.getSize(new THREE.Vector3()).length() / 2;
  const FOV = 28;
  const camera = new THREE.PerspectiveCamera(FOV, 1, 0.05, 400);

  // Where the camera stands: a bearing round the object and a height above it.
  // Three-quarter view by default, because that is how a thing with a front and a
  // side is best shown; square on for anything that is essentially a picture.
  const dir = new THREE.Vector3(
    Math.sin(view.azimuth), view.elevation, Math.cos(view.azimuth),
  ).normalize();

  const basis = new THREE.Matrix4().lookAt(dir, new THREE.Vector3(), camera.up);
  const right = new THREE.Vector3().setFromMatrixColumn(basis, 0);
  const up = new THREE.Vector3().setFromMatrixColumn(basis, 1);
  const tan = Math.tan((FOV * Math.PI / 180) / 2);
  let distance = 0;
  const corner = new THREE.Vector3();
  for (const x of [bbox.min.x, bbox.max.x]) {
    for (const y of [bbox.min.y, bbox.max.y]) {
      for (const z of [bbox.min.z, bbox.max.z]) {
        corner.set(x, y, z).sub(centre);
        const depth = corner.dot(dir);      // towards the camera is positive
        const across = Math.max(Math.abs(corner.dot(right)), Math.abs(corner.dot(up)));
        distance = Math.max(distance, across / tan + depth);
      }
    }
  }
  distance *= view.pad;
  camera.position.copy(centre).addScaledVector(dir, distance);
  camera.lookAt(centre);

  // The key light has to reach the subject wherever it is, and cover all of it.
  key.position.copy(centre).add(new THREE.Vector3(1, 1.5, 1.1).setLength(radius * 4));
  key.target.position.copy(centre);
  scene.add(key.target);
  const span = radius * 1.8;
  Object.assign(key.shadow.camera, {
    left: -span, right: span, top: span, bottom: -span, near: 0.1, far: radius * 12,
  });
  key.shadow.camera.updateProjectionMatrix();

  // Something for the shadow to fall on, invisible in itself, so the object sits on
  // a surface without the PNG gaining a background. Skipped for anything that hangs
  // on a wall or flies: a shadow under a paper plane in mid-air is a shadow on nothing.
  if (view.grounded) {
    const floor = new THREE.Mesh(
      new THREE.PlaneGeometry(radius * 10, radius * 10),
      new THREE.ShadowMaterial({ opacity: 0.26 }),
    );
    floor.rotation.x = -Math.PI / 2;
    floor.position.y = bbox.min.y;
    floor.receiveShadow = true;
    scene.add(floor);
  }

  // Kept in a loop rather than rendered once: the shutter lands whenever it lands,
  // and a canvas whose buffer has been composited away photographs as nothing.
  const draw = () => { requestAnimationFrame(draw); renderer.render(scene, camera); };
  draw();

  document.title = `portrait: ${id}`;
} catch (err) {
  window.portraitFail(err);
}
</script>
</body>
</html>
