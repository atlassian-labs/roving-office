<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Three places to work · The Roving Office</title>
  <script type="importmap">{"imports":{"three":"/vendor/three/build/three.module.js","three/addons/":"/vendor/three/examples/jsm/"}}</script>
  <link rel="stylesheet" href="/src/review/office-collection.css">
</head>
<body data-building="tide">
  <main>
    <canvas id="view" aria-label="Interactive three dimensional office. Drag to orbit, scroll to zoom."></canvas>
    <header class="identity">
      <p class="eyebrow">The Roving Office / Three places to work</p>
      <h1 id="office-name">Tide Wharf</h1>
      <p id="office-description">Pale ash, ink-blue steel and a wide harbour horizon.</p>
      <div class="materials" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
    </header>
    <nav class="office-picker" aria-label="Choose an office">
      <button data-building="tide" aria-pressed="true"><span>01</span>Tide Wharf</button>
      <button data-building="lantern" aria-pressed="false"><span>02</span>Lantern Court</button>
      <button data-building="dune" aria-pressed="false"><span>03</span>Dune Atelier</button>
    </nav>
    <aside class="office-link"><a href="/office/TEST-0000/">Open the working office ↗</a><small>Press S, then choose a Building.</small></aside>
    <section class="controls" aria-label="Explore the architecture">
      <div role="group" aria-label="View">
        <button data-view="room" aria-pressed="true">The room</button>
        <button data-view="close" aria-pressed="false">At the windows</button>
        <button data-view="garden" aria-pressed="false">The setting</button>
      </div>
      <div class="separator"></div>
      <div role="group" aria-label="Light">
        <button data-hour="12" aria-pressed="true">Daylight</button>
        <button data-hour="17" aria-pressed="false">Golden hour</button>
        <button data-hour="21" aria-pressed="false">Evening</button>
      </div>
      <label><span class="sr-only">Season</span><select id="season"><option value="summer">Summer</option><option value="autumn">Autumn</option><option value="winter">Winter</option><option value="spring">Spring</option></select></label>
    </section>
    <p class="hint">Drag to orbit · Scroll to explore · Switch offices to keep the same view</p>
    <p id="loading" role="status">Opening the office…</p>
    <pre id="error" role="alert" hidden></pre>
  </main>
  <script type="module">
    const error = document.querySelector('#error');
    import('/src/review/office-collection.js').catch(e => {
      document.querySelector('#loading').hidden = true;
      error.hidden = false;
      error.textContent = `The office could not be opened.\n${e.message}`;
    });
  </script>
</body>
</html>
