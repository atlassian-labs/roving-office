<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Canopy House · The Roving Office</title>
<script type="importmap">{"imports":{"three":"/vendor/three/build/three.module.js","three/addons/":"/vendor/three/examples/jsm/"}}</script>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#d4d9c9;color:#243c2e;font-family:system-ui,sans-serif}canvas{display:block;width:100%;height:100%;touch-action:none}header{position:absolute;top:24px;left:24px;padding:16px 20px;background:#f4f2e8e8;border:1px solid #ffffff66;border-radius:16px;pointer-events:none}small{font-size:10px;letter-spacing:.22em;text-transform:uppercase}h1{margin:6px 0;font:500 clamp(26px,4vw,46px)/1.1 Georgia,serif}header p{font-size:13px;margin:8px 0}nav{position:absolute;bottom:24px;left:50%;transform:translateX(-50%);max-width:calc(100% - 24px);display:flex;gap:7px;flex-wrap:wrap;justify-content:center;padding:10px;background:#f4f2e8e8;border:1px solid #ffffff88;border-radius:18px;box-shadow:0 8px 28px #18281e18}button,select,a{font:12px system-ui;color:inherit;border:1px solid #aab2a455;border-radius:9px;padding:9px 12px;background:#fafaf4;cursor:pointer;white-space:nowrap;text-decoration:none}button[aria-pressed=true]{background:#38573e;color:white;border-color:#38573e}a{position:absolute;top:30px;right:30px;background:#f5f4e5df}#error{position:absolute;inset:20%;white-space:pre-wrap;color:#761e11;background:#fff;padding:20px;display:none}@media(max-width:600px){header{top:20px;left:20px}header p{max-width:180px}a{top:20px;right:15px;font-size:10px}nav{bottom:12px;width:calc(100% - 24px)}button,select{padding:8px}}
@media(max-width:600px){header{right:20px;padding:14px 18px}header p{max-width:none}small{font-size:8px}a{top:auto;bottom:130px;right:20px}}
</style>
</head>
<body>
<canvas id="view" aria-label="Interactive three dimensional view of Canopy House"></canvas>
<header><small>The Roving Office · a new building</small><h1>Canopy House</h1><p>Warm timber. Tall windows. A little closer to the trees.</p></header>
<a href="/office/TEST-0000/" title="In the office, press S and choose Canopy House under Building">Open the office ↗</a>
<nav aria-label="Explore the building">
<button data-hour="12">Daylight</button><button data-hour="17">Golden hour</button><button data-hour="21">Evening</button>
<select id="season" aria-label="Season"><option value="summer">Summer</option><option value="autumn">Autumn</option><option value="winter">Winter</option><option value="spring">Spring</option></select>
<button data-view="room">The room</button><button data-view="garden">The garden</button><button data-view="close">By the windows</button>
</nav><pre id="error"></pre>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { applyPalette } from '/src/config.js';
import { resolveTheme } from '/src/projects.js';
import { buildEnvironment } from '/src/scene/environment.js';
import { buildProps } from '/src/scene/props.js';
import { addLighting, applyTimeOfDay, createReflectionEnvironment } from '/src/scene/lighting.js';
import { applyNightLights, releaseNightLightAssets } from '/src/scene/night-lights.js';
import { disposeSubtree, clearMaterialCache } from '/src/scene/build.js';
import { createRenderer } from '/src/scene/renderer.js';
const params = new URLSearchParams(location.search);
const renderer = createRenderer({canvas:document.querySelector('#view'),pixelRatio:Math.min(devicePixelRatio,2)});
const scene = new THREE.Scene(), reflection = createReflectionEnvironment(renderer);
scene.environment = reflection.texture;
const camera = new THREE.PerspectiveCamera(42,innerWidth/innerHeight,.1,350);
const controls = new OrbitControls(camera,renderer.domElement);
controls.enableDamping=true;controls.minDistance=5;controls.maxDistance=110;controls.maxPolarAngle=Math.PI*.48;
let root,theme,lights,environment,hour=Number(params.get('hour')||12), season=params.get('season')||'summer';
const fixedRandom = () => { let seed=204; return () => ((seed=Math.imul(seed,1664525)+1013904223>>>0)/4294967296); };
function build(){
  if(root){disposeSubtree(root);scene.remove(root);clearMaterialCache();releaseNightLightAssets()}
  theme=resolveTheme({theme:'canopy'},{season});applyPalette(theme.palette);scene.background=new THREE.Color(theme.sky);
  const nativeRandom=Math.random;Math.random=fixedRandom();
  try{root=new THREE.Group();scene.add(root);lights=addLighting(root,theme.light);environment=buildEnvironment(root,theme);buildProps(root,theme)}finally{Math.random=nativeRandom}
  updateLight();window.canopyReady=true;
}
function updateLight(){const state=applyTimeOfDay(lights,hour,theme,scene);applyNightLights(environment.nightLights,state.lampOn);document.querySelectorAll('[data-hour]').forEach(b=>b.setAttribute('aria-pressed',Number(b.dataset.hour)===hour))}
function view(name){
  const views={room:[[43,31,43],[11.5,3.5,8]],garden:[[67,51,72],[10,3,8]],close:[[25,12.5,23],[6,4.8,6]]};
  const [eye,target]=views[name]||views.room;camera.position.set(...eye);controls.target.set(...target);controls.update();
  document.querySelectorAll('[data-view]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.view===name));
}
document.querySelectorAll('[data-hour]').forEach(b=>b.addEventListener('click',()=>{hour=Number(b.dataset.hour);updateLight()}));
document.querySelectorAll('[data-view]').forEach(b=>b.addEventListener('click',()=>view(b.dataset.view)));
document.querySelector('#season').value=season;
document.querySelector('#season').addEventListener('change',e=>{season=e.target.value;build()});
function resize(){renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix()}
addEventListener('resize',resize);resize();
window.addEventListener('error',e=>{const el=document.querySelector('#error');el.style.display='block';el.textContent=e.error?.stack||e.message});
build();view(params.get('view')||'room');
renderer.setAnimationLoop(()=>{controls.update();renderer.render(scene,camera)});
window.canopyReview={scene,renderer,camera,controls,build,view,setHour(value){hour=value;updateLight()}};
</script>
</body>
</html>
