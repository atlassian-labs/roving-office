<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Roving Office</title>
  <!-- Absolute, not relative: this shell is served for every path under
       /office/<keycard>, and "./styles.css" would be looked for inside the office. -->
  <link rel="stylesheet" href="/styles.css" />
  <!-- The icon set, absolute for the same reason the stylesheet is. /favicon.ico is
       the one a browser asks for whether or not a page mentions it, so it lives at
       the root and carries 16/32/48 in the one file; the PNG is what everything
       modern prefers, and the touch icon is what iOS puts on a home screen.
       All sizes are exported from assets/logo.png. -->
  <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
  <link rel="icon" type="image/png" href="/assets/icon-192.png" sizes="192x192" />
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png" />
  <!-- Three.js via ES module import map (no build step). Vendored locally under
       /vendor/three — see vendor/three/README.md — rather than loaded from a
       public CDN. -->
  <script type="importmap">
    {
      "imports": {
        "three": "/vendor/three/build/three.module.js",
        "three/addons/": "/vendor/three/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="app">
    <canvas id="scene"></canvas>

    <!-- UI overlay -->
    <div id="ui">
      <!-- Darkens the corners while riding an agent. First in the overlay so it
           lies under every panel: it is meant to shade the view, not the UI. -->
      <div id="fpv-vignette" aria-hidden="true"></div>
      <header id="title-bar">
        <div class="brand">
          <h1><img class="brand-mark" src="/assets/logo-64.png" alt="" width="64" height="64" />The Roving Office</h1>
          <!-- The office's keycard: its whole address, and the only way back into
               it. Built by src/ui/keycard-chip.js. -->
          <div id="keycard-chip" class="keycard-chip"></div>
          <!-- Scene switcher is built by src/ui/switcher.js -->
          <div id="scene-switcher" class="switcher"></div>
          <!-- Which source fills this scene, and whether it is connected.
               Filled in by src/ui/source-badge.js. -->
          <div id="source-badge" class="source-badge"></div>
        </div>
      </header>

      <aside id="agent-panel">
        <!-- Closes the roster, exactly as `A` does — main.js fires the registered
             gesture rather than reaching for the class itself, so the key and the
             button cannot come to mean different things. -->
        <button id="agent-panel-close" class="panel-close" type="button"
                aria-label="Close Agents panel" title="Close Agents panel"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="m4 4 8 8m0-8-8 8" stroke="currentColor" stroke-width="1.5"/></svg></button>
        <h2>Agents</h2>
        <ul id="agent-list"></ul>
        <div class="legend">
          <h3>Status</h3>
          <ul id="legend-list"></ul>
        </div>

        <!-- Incoming / removed job feed. The flag lives in a clipping slot
             pinned to the panel's outer edge, so "down" hides it behind the
             panel without any z-index trickery. -->
        <section class="delivery" id="delivery">
          <h3 id="delivery-title">Job Delivery</h3>
          <div id="delivery-body"></div>
          <div class="flag-slot" aria-hidden="true">
            <div class="mail-flag" id="mail-flag">
              <span class="pole"></span>
              <span class="pennant"></span>
            </div>
          </div>
        </section>
      </aside>

      <div id="inspector" class="hidden">
        <button id="inspector-close" class="panel-close" type="button"
                aria-label="Close Agent detail panel" title="Close Agent detail panel"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="m4 4 8 8m0-8-8 8" stroke="currentColor" stroke-width="1.5"/></svg></button>
        <h2 id="inspector-name">Agent</h2>
        <div id="inspector-body"></div>
      </div>

      <!-- The bottom strips, stacked. Both are shallow full-width panels along the
           bottom of the screen and either can be open on its own, so they are laid out
           by a column rather than each being placed by hand: whichever are open sit on
           top of one another in order, and a panel that grows a second row of controls
           pushes the one above it up instead of disappearing underneath it.

           The editor comes first so it ends up on top, nearest the room it is editing.
           The container ignores the pointer and the panels take it back, so the empty
           gap between them is not a strip of dead screen. -->
      <div id="bottom-stack">
        <!-- Furniture editor panel: toggled with E, built by src/editor/panel.js. -->
        <div id="editor-panel" class="hidden"></div>

        <!-- Scene panel: toggled with S, built by src/ui/scene-panel.js. -->
        <div id="scene-panel" class="hidden"></div>

        <!-- Developer panel: toggled with V, built by src/ui/dev-panel.js. -->
        <div id="dev-panel" class="hidden"></div>
      </div>

      <!-- Shortcuts modal. The host doubles as the dismissing backdrop, so it
           stays empty here; src/ui/shortcuts.js fills in the card. -->
      <div id="shortcuts-panel" class="hidden"></div>

      <!-- Source picker modal, same arrangement: the host is the backdrop and
           src/ui/source-picker.js fills in the card. Shown for a scene with no feeds. -->
      <div id="source-picker" class="hidden"></div>

      <!-- The office's own dialog, opened by clicking the keycard: the link, who is
           here, the passcode and closing the office. Same arrangement again — the host
           is the backdrop and src/ui/keycard-dialog.js fills in the card. -->
      <div id="keycard-dialog" class="hidden"></div>

      <!-- The First Person panel: whose eyes you are looking through and what they
           are working on, while riding an agent (f). Filled in by src/ui/fpv-hud.js,
           which also hides the title bar for the duration. -->
      <div id="fpv-hud" class="hidden" aria-live="polite"></div>

      <div id="loading">Opening the office…</div>
    </div>
  </div>

  <!-- Absolute for the same reason as the stylesheet: the shell is served for
       /office/<keycard> and anything under it. -->
  <script type="module" src="/src/main.js"></script>
</body>
</html>
